name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke-test the pipeline
        run: |
          python src/phenotyping.py
      - name: Verify dashboard imports
        run: |
          python -c "import sys; sys.path.insert(0,'.'); import dashboard.app" || \
          python -c "print('dashboard import requires a display; pipeline test is the gate')"
